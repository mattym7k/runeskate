# Controller setup (ControllerSetupView)
setup.get=A free program (Windows and Linux) that turns each controller button into one key. RuneSkate itself never \
reads the controller.
setup.load=Save the profile, then in AntiMicroX click Load and pick it. It works with Xbox, PlayStation and other \
pads. Updated RuneSkate? Load the new profile again: every button now sends its own key.
setup.on=In the RuneSkate settings (top section) turn on Controller mode and pick a Controller preset. Start skating, \
keep the game window focused and the cursor over the game.
setup.test=Click the game window, then press buttons: each lights up while held, and gets a tick once seen. The left \
stick shows the arrows, the right stick the mouse. Nothing is pressed for you.
# {0}: each button and its key
setup.steam=Steam Input can do what the profile does. Map each button to one key (no macros, turbo or chords): {0}. \
Left stick: the arrow keys, as a four-way d-pad. Right stick: the mouse (joystick mouse).
setup.off=<font color='#ff9678'>Controller mode is off: the pad test works, but skating reads the pad only with it \
on.</font>

# Customise controller (ControllerLayoutView); layout.from: the Start from choices, in order
layout.from=Skate 3\n\
Your saved layout\n\
Nothing (blank)\n\
Tony Hawk's American Wasteland
layout.intro=Pick what each button does on the board and on foot. Save makes it your Custom controller preset. The \
left stick steers and leans; the right one flicks, or with a flip or grab button in the layout it turns the camera \
(the left stick and d-pad then aim the button tricks).
layout.saved=Saved: the pad now plays your Custom preset.
layout.busy=The clipboard is busy. Your code: {0}
layout.paste=Paste a RuneSkate layout code (it starts with {0}:)
layout.same=That code is the layout you have already.

