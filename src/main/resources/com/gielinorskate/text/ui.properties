# RuneSkate ui text

# Trick Book (TrickBook). Control lists: one control a line, "name|keys|pad", with the button tricks' pad wording
# after a fourth "|"; a rule is "name|detail".
book.flips.bt=Hold a direction on the left stick (or the d-pad, for the diagonals) and press {0}, in the air or \
rolling (it pops straight into the flip). Press it again mid-flip for a double, then a triple.
book.flips.pad=Pull the right stick down, then flick it (no button). Flick again mid-flip for a double, then a triple.
book.flips.mouse=Hold the {1} mouse button, drag down, then flick. Flick again mid-flip for a double, then a triple.
book.flips.keys=Hold a trick key to crouch, let go to pop. Flick again mid-flip for a double, then a triple.
book.shift=Hold {0} as the trick fires for the harder version.
book.manuals=Balance on two wheels while rolling. Scores per second.
book.grinds=Ollie onto a rail or ledge and land along it: the board locks on. Hold W or S as you land for the \
variations; jump to leave. "Show grindable edges" draws what you can grind. Scores per second.
book.grinds.bt=Ollie onto a rail or ledge and land along it: the board locks on. Hold W or S as you land for the \
variations; jump to leave. "Show grindable edges" draws what you can grind. Scores per second. Hold {0} near a rail \
to catch it from further away (rails still catch without it).
book.basics=Start and stop|Stand still, then press {0} (or Start skating in this panel). Esc stops.|Stand still, \
then press {0} (or Start skating in this panel). {@stop} stops.\n\
Push|W, tap or hold (the Up arrow works too)|{@push}, tap or hold|{LS} up, tap or hold\n\
Carve|A / D steer (or the arrow keys)|{LS} left / right\n\
Brake (powerslide)|Hold Shift alone{1}|Hold {@brake}|Hold {@mod} alone\n\
Tight turn|Hold Shift and steer: a sharp carve that scrubs speed|Hold {@brake} and steer with {LS}|Hold {@mod} and \
steer with {LS}\n\
Crouch|Hold S. Crouching longer before a pop jumps higher|Hold S
book.basics2=Get up|R after a bail: straight back on the board; or to stop rolling. Off in a Skate Duel|{@reset} \
after a bail: straight back on the board; or to stop rolling. Off in a Skate Duel\n\
Controls card|H shows or hides it|{@card} shows or hides it
book.spins=Spin with any trick: the spin goes in front of its name ("FS 180 Kickflip"). Backside turns your back to \
where you are going first.
book.spins.bt=Turn with the left stick in the air (hold {0} to spin faster)
book.spins.pad=Turn with the left stick in the air
book.spins.keys=Turn with A / D in the air
book.grabs.bt=In the air, hold a direction (the left stick, or the d-pad for the diagonals) and hold {0}. Held over \
{1} s it turns into its tweak. Hold a grab, or {2}, and push the left stick up / down for a front / back flip. \
Scores per second. Rolling, hold {0} to grab the board on the ground: style only.
book.grabs.pad=In the air, hold {0} or {1} and move the right stick just after to aim the grab. Held over {2} s it \
turns into its tweak. Hold a grab, or {3}, and push the left stick up / down for a front / back flip. Scores per \
second. Rolling, hold {0} or {1} to crouch and grab the board on the ground: style only (no points, no pushing while \
held). Pop with it held to grab in the air; land with it held to keep it.
book.grabs.mouse=In the air, hold {0} or {1} and move the mouse just after to aim the grab. Held over {2} s it turns \
into its tweak. Hold a grab and press {4} / {5} for a front / back flip. Scores per second. Rolling, hold {0} or {1} \
to crouch and grab the board on the ground: style only (no points, no pushing while held). Pop with it held to grab \
in the air; land with it held to keep it.
book.off=Step off / get on|{0}: step off and carry the board; again to get on|{@board}: step off and carry the \
board; again to get on\n\
Walk|WASD (W is away from the camera)|{LS} (up is away from the camera)\n\
Sprint|Hold Shift|Hold {@sprint}\n\
Jump|Space|{@jump}\n\
Drop or pick up|Q / E: drop the board, or pick it up when close|{@drop}: drop the board, or pick it up when close\n\
Call it back|Board far away: press {0} (no need to hold)|Board far away: press {@board} (no need to hold)\n\
Knocked off|A bail knocks you off: a move key or Space gets you up sooner, {0} gets the board back at once|A bail \
knocks you off: {LS} or {@jump} gets you up sooner, {@board} gets the board back at once\n\
Jump-mount|Jump onto the board, or sprint and jump carrying it: you land rolling|Jump onto the board, or sprint and \
jump carrying it: you land rolling
# the left stick's and the right stick's lines in the Controller section
book.sticks=Steer; in the air, spin. Up / down with a grab: flip. On foot: walk\n\
Pull down, flick: tricks. Small tilt up / down, held: manual / nose manual. Aims grabs
book.sticks.bt=Steer; in the air, spin. Up: push. The direction for the trick buttons (the d-pad gives the \
diagonals). Up then down, quickly: manual (down then up: nose manual). On foot: walk\n\
Turns the camera. On the board it eases back behind you {0} s after you let go
book.controller=Preset: {0}. Turn on Controller mode (RuneSkate section of the settings) and load the RuneSkate \
profile in AntiMicroX (side panel: Controller setup).
book.scoring=Combo|Tricks, spins, grabs, grinds and manuals chained without stopping are one combo. It banks when \
you roll on without a new trick; a bail loses it.\n\
Multiplier|Each different trick in the combo adds 1 to the multiplier. The combo is worth its points times the \
multiplier.\n\
Repeats|Each repeat of a trick in a session is worth {0} less, down to {1} of its points.\n\
Variety bonus|+{2} for a trick's first landing in a session. A combo longer than {3} s gets one more multiplier.\n\
Clean landing|+{4} for landing lined up with the board.\n\
Skating XP|A landed combo gives its value / {5} as Skating XP. Levels go to {6}.\n\
Daily goals|{7} goals each UTC day; each one done is worth {8} XP.\n\
Board designs|{10}. Bronze to Torva each come as a grip, a deck and wheels; mix them freely under Board in this \
panel.\n\
Timed run|Start {9}-minute run in this panel while skating: land as much as you can in {9} minutes. Bails don't end \
it.\n\
Leaderboards|Opt in with "Submit scores to the leaderboard" (RuneSkate settings): this week's best combo, timed runs \
and Skating XP are ranked in the Leaderboards section.

# How each trick is done (TrickGuide): "TRICK|how" a line. guide.how: mouse and keys; guide.padHow: the controller
# with the stick layouts; guide.buttonHow: the button-trick layouts. guide.diagonals: the d-pad's diagonals.
guide.none=Not on the buttons: a mouse flick or a trick key
guide.how=DOUBLE_KICKFLIP|Kickflip, then flick up-left again\n\
DOUBLE_HEELFLIP|Heelflip, then flick up-right again\n\
TRIPLE_KICKFLIP|Double kickflip, then flick up-left again\n\
TRIPLE_HEELFLIP|Double heelflip, then flick up-right again\n\
INDY|Hold Q in the air (or E, moving the mouse to the toe side)\n\
MELON|Hold E in the air (or Q, moving the mouse to the heel side)\n\
MUTE|Hold Q in the air, moving the mouse to the toe side\n\
STALEFISH|Hold E in the air, moving the mouse to the heel side\n\
NOSEGRAB|Hold Q in the air, moving the mouse up\n\
TAILGRAB|Hold Q or E in the air, moving the mouse down\n\
CRAIL|Hold E in the air, moving the mouse up\n\
FRONTFLIP|Hold Shift+W in the air\n\
BACKFLIP|Hold Shift+S in the air\n\
DOUBLE_FRONTFLIP|Hold Shift+W through a big air\n\
DOUBLE_BACKFLIP|Hold Shift+S through a big air\n\
MANUAL|Hold the wheelie key while rolling\n\
NOSE_MANUAL|Hold the wheelie key and W\n\
FIFTY_FIFTY|Land along a rail or edge\n\
NOSEGRIND|Land along a rail, holding W\n\
FIVE_O|Land along a rail, holding S\n\
CROOKED|Land a little across a rail\n\
FEEBLE|Land a little across a rail, holding W\n\
SMITH|Land a little across a rail, holding S\n\
BOARDSLIDE|Land across a rail\n\
NOSESLIDE|Land across a rail, holding W\n\
TAILSLIDE|Land across a rail, holding S\n\
LIPSLIDE|Land across a rail, turned past square
guide.padHow=MANUAL|Hold {RS} tilted up a little while rolling\n\
NOSE_MANUAL|Hold {RS} tilted down a little while rolling\n\
FRONTFLIP|Hold {@mod} and {LS} up in the air (or hold a grab and {LS} up)\n\
BACKFLIP|Hold {@mod} and {LS} down in the air (or hold a grab and {LS} down)\n\
DOUBLE_FRONTFLIP|Hold {@mod} and {LS} up through a big air\n\
DOUBLE_BACKFLIP|Hold {@mod} and {LS} down through a big air
guide.buttonHow=OLLIE|Hold {@ollie} to crouch, let go to pop\n\
DOUBLE_KICKFLIP|Kickflip, then {@flip} again mid-flip\n\
DOUBLE_HEELFLIP|Heelflip, then {@flip} again mid-flip\n\
TRIPLE_KICKFLIP|Double kickflip, then {@flip} again\n\
TRIPLE_HEELFLIP|Double heelflip, then {@flip} again\n\
MANUAL|{LS} up, then down within 0.3 s while rolling: it holds until you pop\n\
NOSE_MANUAL|{LS} down, then up within 0.3 s while rolling
guide.diagonals=UP_LEFT|{DUP}{DLEFT} (d-pad up-left)\n\
UP_RIGHT|{DUP}{DRIGHT} (d-pad up-right)\n\
DOWN_LEFT|{DDOWN}{DLEFT} (d-pad down-left)\n\
DOWN_RIGHT|{DDOWN}{DRIGHT} (d-pad down-right)

# What each pad action does (PadWords): "ACTION|words" a line, "ACTION.foot|words" for its on-foot wording
pad.does=PUSH|Push (tap or hold)\n\
MONGO_PUSH|Mongo push (tap or hold)\n\
BRAKE|Brake\n\
OLLIE|Hold to crouch, let go to ollie\n\
GRAB_LEFT|Grab (left hand) in the air, or rolling (style only)\n\
GRAB_RIGHT|Grab (right hand) in the air, or rolling (style only)\n\
HARD_MODIFIER|Shift: hard flips with a flick, tight turn with {LS}, brake held alone. In the air, hold with {LS} up \
/ down for a front / back flip\n\
LEAN_FORWARD|Lean forward: with a grab in the air, a front flip\n\
LEAN_BACK|Lean back: with a grab in the air, a back flip\n\
BOARD_TOGGLE|Step off and carry the board, or get on. Far away: calls it back\n\
BOARD_TOGGLE.foot|get on, or call a far board back\n\
RESET|Get up after a bail, or stop\n\
RESET.foot|get up\n\
STOP|Stop skating\n\
STOP.foot|stop skating\n\
CONTROLS_CARD|Controls card\n\
CONTROLS_CARD.foot|controls card\n\
SPRINT|sprint (hold)\n\
JUMP|jump\n\
DROP_PICKUP|drop or pick up the board\n\
CAMERA_ORBIT|hold and move {RS} to turn the camera\n\
FLIP_BUTTON|Flip trick: hold a direction ({LS}, or the d-pad for diagonals) and press. Again mid-flip: a double\n\
GRAB_BUTTON|Grab: hold a direction and the button in the air (rolling: style only)\n\
GRIND_BUTTON|Near a rail, hold to catch it from further away. Rolling with no rail near: step off\n\
SPIN_ASSIST|Hard tricks (as Shift; alone, a brake). In the air, hold to spin faster
# The pad text placeholders (PadWords.resolve): "name|ACTION|CONTEXT|joiner|key", no joiner for the first button
# only, no key for the board key
pad.places=push|PUSH|BOARD| or |W\n\
pushFirst|PUSH|BOARD||W\n\
brake|BRAKE|BOARD| or |the brake key\n\
ollie|OLLIE|BOARD|/|Space\n\
flip|FLIP_BUTTON|BOARD|/|the flip button\n\
grabBtn|GRAB_BUTTON|BOARD|/|the grab button\n\
grind|GRIND_BUTTON|BOARD|/|the grind button\n\
grabL|GRAB_LEFT|BOARD|/|Q\n\
grabR|GRAB_RIGHT|BOARD|/|E\n\
reset|RESET|BOARD|/|R\n\
card|CONTROLS_CARD|BOARD|/|H\n\
stop|STOP|BOARD|/|Esc\n\
board|BOARD_TOGGLE|FOOT|/\n\
sprint|SPRINT|FOOT||Shift\n\
jump|JUMP|FOOT|/|Space\n\
drop|DROP_PICKUP|FOOT| / |Q / E

