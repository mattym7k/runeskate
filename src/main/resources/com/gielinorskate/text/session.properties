# session/SafetyRules
sr.instance=You can't skate in an instance.
sr.minigame=You can't skate in a PvP minigame.
sr.world.PVP_ARENA=You can't skate on a PvP Arena world.
sr.world.LAST_MAN_STANDING=You can't skate on a Last Man Standing world.
sr.world.BOUNTY=You can't skate on a Bounty Hunter world.
sr.combat=You can't skate while in combat (wait until your health bar disappears).
sr.pvp.true=You can't skate in the Wilderness. To allow it, turn on 'Allow skating in PvP areas' in the RuneSkate settings (Advanced section).
sr.pvp.false=You can't skate on a PvP world. To allow it, turn on 'Allow skating in PvP areas' in the RuneSkate settings (Advanced section).
sr.ended.minigame=Skate mode ended: you can't skate into a PvP minigame.
sr.ended.wild=Skate mode ended: you can't skate into the Wilderness. To allow it, turn on 'Allow skating in PvP areas' in the RuneSkate settings (Advanced section).
