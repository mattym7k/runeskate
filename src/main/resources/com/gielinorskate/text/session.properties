# RuneSkate session text

# session/ComfortHints
ch.click=Clicks are paused while skating: use W to push and A/D to steer. Esc to stop.
ch.welcome=RuneSkate installed: stand still and press {0} to skate (or use the skateboard button in the sidebar).
ch.manual.tricks=Keyboard tricks use {0}, so your wheelie (manual) key is {1} while skating.
ch.manual.clash=Wheelie (manual) key {0} clashes with a skate control or is not a single key - using {1} instead.
ch.board.tricks=Keyboard tricks use {0}, so F steps on and off the board instead. Pick another key in the RuneSkate settings.
ch.board.control=Your Board on/off key ({0}) is a skate control, so F steps on and off the board instead. Pick another key in the RuneSkate settings.
ch.clash=Your Board on/off key ({0}) is also your {1}: {0} only steps on and off the board while skating. Change one of them in the RuneSkate settings.
ch.pad.setup=Controller mode is on. To set up your controller, open the RuneSkate side panel and click Controller setup: get AntiMicroX, save the RuneSkate profile and load it, then test your pad. Pick a Controller preset in the settings.
ch.pad.broken=Your Custom controller layout can't be read, so the pad plays as Skate 3. Set it again in the side panel (Customise controller).
ch.padkey=Your {0} ({1}) is the key the controller's {2} button sends, so that button does nothing in Controller mode. Pick another key in the RuneSkate settings.
ch.idle=The game hasn't seen input for {0} minute{1} and will log you out soon. Skate keys don't count: move the mouse to stay logged in.
ch.dmg.poison=Poison damage knocks you off your board. Cure the poison to skate without interruptions.
ch.dmg.venom=Venom damage knocks you off your board. Cure the venom to skate without interruptions.
ch.dmg.hit=You took damage, so you hop off your board.

# session/SkateSession
ss.boat=You can't skate on a boat or moving platform.
ss.model=RuneSkate couldn't build the board model.
ss.on=Skate mode on. Press H for controls, Esc to stop.
ss.edge=You're near the edge of the loaded area (about {0} tiles away), where an invisible wall stops you. Walk to a more central spot for more room.
ss.error=RuneSkate hit an error and stopped.
ss.knock.true=Knocked off! {0} gets your board back (step on it nearby, or it comes to your hands).
ss.knock.false=Knocked off! {0} gets your board back (step on it nearby, or it comes to your hands), R gets straight back on. Settings: After a bail.
ss.foot=On foot: WASD walk, Shift sprint, Space jump, Q / E drop or pick up the board, {0} to get back on.
ss.moved=Skate mode ended because your character moved.
ss.next=That setting applies next time you start skating.

