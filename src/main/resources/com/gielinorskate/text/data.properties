# RuneSkate data text

# Trick catalogue, one entry per Trick constant (party ghosts send tricks by constant name, so the names
# must not change): display name|kind|points|rollTurns|yawTurns|duration|pitchTurns|bodyYawTurns|bodyFlipTurns
# Points are flat for POP/FLIP and per second for GRAB/MANUAL/GRIND. Turns are full turns (1 = 360 degrees),
# duration the seconds the board rotation takes (0 for holds and body flips).
trick.OLLIE=Ollie|POP|100|0|0|0|0|0|0
trick.NOLLIE=Nollie|POP|150|0|0|0|0|0|0
trick.KICKFLIP=Kickflip|FLIP|300|1|0|0.35|0|0|0
trick.HEELFLIP=Heelflip|FLIP|300|-1|0|0.35|0|0|0
trick.POP_SHOVE_IT=Pop Shove-it|FLIP|250|0|0.5|0.30|0|0|0
trick.FS_POP_SHOVE_IT=FS Pop Shove-it|FLIP|250|0|-0.5|0.30|0|0|0
trick.SHOVE_IT_360=360 Shove-it|FLIP|500|0|1|0.40|0|0|0
trick.FS_SHOVE_IT_360=FS 360 Shove-it|FLIP|500|0|-1|0.40|0|0|0
trick.VARIAL_KICKFLIP=Varial Kickflip|FLIP|600|1|0.5|0.40|0|0|0
trick.VARIAL_HEELFLIP=Varial Heelflip|FLIP|600|-1|-0.5|0.40|0|0|0
trick.TRE_FLIP=360 Flip|FLIP|900|1|1|0.45|0|0|0
trick.LASER_FLIP=Laser Flip|FLIP|950|-1|-1|0.45|0|0|0
trick.DOUBLE_KICKFLIP=Double Kickflip|FLIP|800|2|0|0.50|0|0|0
trick.DOUBLE_HEELFLIP=Double Heelflip|FLIP|800|-2|0|0.50|0|0|0
trick.NOLLIE_KICKFLIP=Nollie Kickflip|FLIP|350|1|0|0.35|0|0|0
trick.NOLLIE_HEELFLIP=Nollie Heelflip|FLIP|350|-1|0|0.35|0|0|0
# nollie forms of the shove-its and the 360 flip: 50 more than the regular trick, like the other nollies
trick.NOLLIE_SHOVE_IT=Nollie Shove-it|FLIP|300|0|0.5|0.30|0|0|0
trick.NOLLIE_FS_SHOVE_IT=Nollie FS Shove-it|FLIP|300|0|-0.5|0.30|0|0|0
trick.NOLLIE_TRE_FLIP=Nollie 360 Flip|FLIP|1000|1|1|0.45|0|0|0
trick.INDY=Indy|GRAB|300|0|0|0|0|0|0
trick.MELON=Melon|GRAB|300|0|0|0|0|0|0
# directional grabs (a grab key held while the mouse moves; see Grabs) and their tweaks: a grab held past
# 0.5 s turns into its tweak, worth half as much again per second
trick.MUTE=Mute|GRAB|300|0|0|0|0|0|0
trick.STALEFISH=Stalefish|GRAB|350|0|0|0|0|0|0
trick.NOSEGRAB=Nosegrab|GRAB|300|0|0|0|0|0|0
trick.TAILGRAB=Tailgrab|GRAB|300|0|0|0|0|0|0
trick.CRAIL=Crail|GRAB|350|0|0|0|0|0|0
trick.METHOD=Method|GRAB|450|0|0|0|0|0|0
trick.TWEAKED_INDY=Tweaked Indy|GRAB|450|0|0|0|0|0|0
trick.JAPAN=Japan|GRAB|450|0|0|0|0|0|0
trick.TWEAKED_STALEFISH=Tweaked Stalefish|GRAB|525|0|0|0|0|0|0
trick.NOSEBONE=Nosebone|GRAB|450|0|0|0|0|0|0
trick.TAILBONE=Tailbone|GRAB|450|0|0|0|0|0|0
trick.CRAIL_TWEAK=Crail Tweak|GRAB|525|0|0|0|0|0|0
trick.MANUAL=Manual|MANUAL|150|0|0|0|0|0|0
trick.NOSE_MANUAL=Nose Manual|MANUAL|200|0|0|0|0|0|0
trick.FIFTY_FIFTY=50-50|GRIND|200|0|0|0|0|0|0
trick.FIVE_O=5-0|GRIND|250|0|0|0|0|0|0
trick.NOSEGRIND=Nosegrind|GRIND|250|0|0|0|0|0|0
trick.BOARDSLIDE=Boardslide|GRIND|250|0|0|0|0|0|0
trick.CROOKED=Crooked Grind|GRIND|300|0|0|0|0|0|0
# slide and crooked variations (W / S while locking or mid-grind) and the lipslide (board turned past
# square to the approach): each a little harder to hold than the plain one, so worth a little more
trick.NOSESLIDE=Noseslide|GRIND|300|0|0|0|0|0|0
trick.TAILSLIDE=Tailslide|GRIND|300|0|0|0|0|0|0
trick.SMITH=Smith Grind|GRIND|350|0|0|0|0|0|0
trick.FEEBLE=Feeble Grind|GRIND|350|0|0|0|0|0|0
trick.LIPSLIDE=Lipslide|GRIND|300|0|0|0|0|0|0
# Shift held as the flick fires. (Party ghosts send tricks by name: renaming a constant breaks the wire.)
# Impossible: the board wraps end over end around the back foot (pitch, nose up and over)
trick.IMPOSSIBLE=Impossible|FLIP|450|0|0|0.40|1|0|0
# hardflip = kickflip + frontside shove; inward heelflip = heelflip + backside shove
trick.HARDFLIP=Hardflip|FLIP|500|1|-0.5|0.40|0|0|0
trick.INWARD_HEELFLIP=Inward Heelflip|FLIP|500|-1|0.5|0.40|0|0|0
# bigspin: a 360 shove-it with the body turning 180 the same way (applied by physics over the duration)
trick.BIGSPIN=Bigspin|FLIP|550|0|1|0.45|0|0.5|0
trick.FS_BIGSPIN=FS Bigspin|FLIP|550|0|-1|0.45|0|-0.5|0
trick.NOLLIE_HARDFLIP=Nollie Hardflip|FLIP|550|1|-0.5|0.40|0|0|0
trick.NOLLIE_INWARD_HEELFLIP=Nollie Inward Heelflip|FLIP|550|-1|0.5|0.40|0|0|0
# a re-flick during a double
trick.TRIPLE_KICKFLIP=Triple Kickflip|FLIP|1300|3|0|0.65|0|0|0
trick.TRIPLE_HEELFLIP=Triple Heelflip|FLIP|1300|-3|0|0.65|0|0|0
# body flips (Shift + W / Shift + S in the air): the whole skater turns end over end, scored on landing
trick.FRONTFLIP=Frontflip|FLIP|1000|0|0|0|0|0|1
trick.BACKFLIP=Backflip|FLIP|1000|0|0|0|0|0|-1
trick.DOUBLE_FRONTFLIP=Double Frontflip|FLIP|2200|0|0|0|0|0|2
trick.DOUBLE_BACKFLIP=Double Backflip|FLIP|2200|0|0|0|0|0|-2

# GrabPose: each plain grab's pose (grabpose.grabs lists them; a tweak uses its plain grab's row, 1.6 times
# further). Per grab: torsoLean (+ toward the nose), body roll (- toward the chest / toes), board pitch, board
# roll; then where on the board the hand holds: units along the board (+ toward the nose), units across it
# (- toward the toe edge, the rider's chest side; + the heel edge; 13 is the deck's edge), and the board-model
# height there (-14 the deck's edge, or -20 near the nose or tail tip, where the kicktails rise to -23).
grabpose.grabs=INDY MELON MUTE STALEFISH NOSEGRAB TAILGRAB CRAIL
grabpose.INDY=-0.1 -0.18 0 0.25 -6 -13 -14
grabpose.MELON=0.1 0.18 0 -0.25 6 13 -14
grabpose.MUTE=0.15 -0.2 -0.08 0.22 18 -13 -14
grabpose.STALEFISH=-0.15 0.22 0.08 -0.22 -18 13 -14
grabpose.NOSEGRAB=0.45 0 -0.3 0 43 0 -20
grabpose.TAILGRAB=-0.45 0 0.3 0 -43 0 -20
grabpose.CRAIL=0.4 -0.1 -0.25 0.12 40 -6 -20

# PushCycle keyframe values: back and side at the foot keys (0, lift end, plant start, plant end, recover end,
# settled, 1), lean at the body keys (0, 0.12, plant start, 0.60, 0.84, 1)
push.back=0 -4 -2 50 24 0 0
push.side=0 14 17 17 12 0 0
push.lean=0 0 0.14 0.14 0 0

# BailReason texts, shown under "Bailed" on the HUD
bail.SIDEWAYS=Landed sideways - finish the spin
bail.FLIP_NOT_CAUGHT=Board still flipping - jump higher
bail.BODY_FLIP=Flip not finished - jump higher
bail.WALL=Hit a wall

# Render warnings (SkaterAnimator, shown in chat) and log messages (SkaterAnimator, PuppetController)
skanim.poseVanished=That animation made your skater disappear, so the skate poses were reset to the defaults.
skanim.gaitSpeedFailed=Could not speed up the walk animation; it plays at the game's speed from now on
skanim.walkVanished=Your walk animation made your character disappear, so it stands still on foot for now.
skanim.knockdownVanished=The knocked-down animation made your skater disappear, so a plain fall is used for now.
skanim.paceFailed=Could not pace the animation; it plays at the game's speed
puppet.deformFailed=Skater mesh deformation failed, drawing the plain animation from now on
puppet.handFailed=Could not read the skater's hand; the carried board stays at its fixed spot from now on

# Errors reading the bundled board geometry (BakedBoardGeometry) and design colour files (DesignColours)
board3.triangleSize=a triangle needs 3 indices and 3 colours (and maybe 3 UVs)
board3.vertexOrder=vertex {0} is not defined above or not in first-use order
board3.partEmpty=part {0} has no triangles or unused vertices
board3.record=unknown record or no part yet
designs.size=design colour file size does not match its {0} triangles
designs.version=design colour file of version {0} / part {1}
designs.whole=colours must come in whole triangles
