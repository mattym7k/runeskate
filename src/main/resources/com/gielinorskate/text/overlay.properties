# Why a layout code was refused (LayoutCode)
code.empty=There is no layout code to read.
code.long=That code is too long to be a RuneSkate layout (over {0} characters).
code.header=That isn't a RuneSkate layout code: they start with {0}
code.newer=That layout code is from a newer RuneSkate. Update the plugin to use it.
code.version=That layout code's version ({0}) isn't one RuneSkate knows.
code.chars=That layout code is damaged: it has characters a code never has.
code.missing=That layout code is damaged: part of it is missing.
code.button=That layout code names a controller button RuneSkate doesn't know.
code.twice=That layout code sets {0} twice.
code.action=That layout code has an action this version of RuneSkate doesn't know. Update the plugin to use it.
code.problem=That layout code can't be used: {0}.

# Near-miss flick hints (NearMiss): the HUD line, then the controller-mode line
miss.TOO_SLOW=Flick faster: a quick snap after the pull down\n\
Flick faster: snap {RS} all the way after the pull down
miss.TOO_SHORT=Flick further: a longer snap after the pull down\n\
Flick further: a longer {RS} snap after the pull down
miss.NO_WIND_UP=Pull down first, then flick\n\
Pull {RS} down first, then flick

