pad.action.GRAB_LEFT=5,B,Grab (left hand)
pad.action.GRAB_RIGHT=6,B,Grab (right hand)
pad.action.HARD_MODIFIER=7,B,Hard tricks (Shift)
pad.action.LEAN_FORWARD=8,B,Lean forward
pad.action.LEAN_BACK=9,B,Lean back
pad.action.BOARD_TOGGLE=10,BF,Board on / off
pad.action.RESET=11,BF,Reset (get up)
pad.action.STOP=12,BF,Stop skating
pad.action.CONTROLS_CARD=13,BF,Controls card
pad.action.SPRINT=14,F,Sprint (hold)
pad.action.JUMP=15,F,Jump
pad.action.DROP_PICKUP=16,F,Drop / pick up the board
pad.action.CAMERA_ORBIT=17,F,Turn the camera (hold, right stick)
pad.action.FLIP_BUTTON=18,B,Flip trick (+ direction)
pad.action.GRAB_BUTTON=19,B,Grab (+ direction)
pad.action.GRIND_BUTTON=20,B,Grind (or step off)
pad.action.SPIN_ASSIST=21,B,Hard tricks + spin faster

