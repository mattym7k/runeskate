# RuneSkate overlay text

# Controls card (ControlsCardOverlay)
card.hide=Skating controls   {0}: hide
card.book=Full trick list: Trick Book in the side panel
card.learn=Push and jump once to put this card away
card.keys.basics=W: push   A/D: steer   Shift alone: brake (with A/D: tight turn)   S: crouch
card.keys.mouse=Tricks: hold the {0} mouse button, drag down, then flick
card.keys.both=Keys too: Space, 1-4, 5-0 (Alt: nollie, Shift: harder). Again mid-flip: double
card.keys.trickTitle=Trick keys: hold to crouch, let go to pop.  Alt: nollie
card.keys.tricks=Space: ollie   1: kickflip   2: heelflip   3: shove-it   4: FS shove-it
card.keys.air=In the air: A/D spin   Q/E: grab (rolling too, for style)   Rail: land on it to grind   Hold {0}: manual
card.keys.reset=R: back on after a bail   {0}: step off and carry the board   Esc: stop skating
card.pad.mouse=Tricks: {RS} pull down, then flick (no button).
card.pad.keys=Trick keys: Space ollie, 1 kickflip, 2 heelflip, 3-0 more (Alt: nollie)
card.pad.air=In the air: {LS} spin   {0}: grab   Grab{1} + {LS} up/down: front/back flip
card.pad.rail=Rail: land to grind   {RS} small tilt up, held: manual   Rolling: {0} grab
card.pad.reset={0}: get up after a bail   {1}: step off and carry the board   {2}: stop skating
# the button-trick card, one line each; the first and third are titles
card.bt=Skating controls   {@card}: hide\n\
{LS} up: push   {LS} left/right: steer   Hold {@ollie}, let go: ollie   {@modSlash}: hard tricks (alone: brake)\n\
Tricks: hold a direction ({LS}, or the d-pad for diagonals) and press\n\
{@flip}: left kickflip, right heelflip, up impossible, down shove-it. Again mid-flip: double\n\
{@grabBtn} held: left melon, right indy, up nosegrab, down tailgrab, none indy\n\
In the air: {LS} spin ({@modSlash}: faster)   {@grind} near a rail: grind   {LS} up, then down: manual\n\
{RS}: camera   {@reset}: get up   {@grind} rolling, no rail: step off   {@stop}: stop
card.foot.title=On foot   {0}: hide
card.foot.pad={LS}: walk (up is away from the camera)    Hold {0}: sprint    {1}: jump\n\
{2}: drop the board, or pick it up when close
card.foot.orbit=Hold {0} and move {RS}: turn the camera
card.foot.keys=WASD: walk (W is away from the camera)    Hold Shift: sprint    Space: jump\n\
Q / E: drop the board, or pick it up when close\n\
Middle mouse drag: turn the camera
card.foot.end={0}: get on (the board goes under your feet, or step onto it nearby)\n\
Board far away: {0} calls it back to your hands\n\
Jump onto the board, or sprint and jump carrying it: land rolling\n\
{1}: stop skating.  No tricks or points on foot

